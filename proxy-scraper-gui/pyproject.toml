[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-scraper-gui"
version = "1.0.0"
description = "Cross-platform PyQt6 desktop app that scrapes, validates, geolocates, and exports free proxy servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Proxy Scraper GUI" }]
dependencies = [
    "PyQt6>=6.6.0",
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.4",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "geoip2>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
proxy-scraper-gui = "main:main"

[tool.setuptools]
packages = ["proxy_scraper"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
