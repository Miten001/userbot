# ─────────────────────────────────────────────────────────────────────────
#  GhostShell — configuration
#  One file, understood by ghostshell.sh (Linux/macOS) and GhostShell.ps1
#  (Windows). Lines starting with # are comments. No spaces around = .
#
#  If you set the exit country from the extension popup instead, leave
#  TIMEZONE and LOCALE empty here — otherwise the two can disagree.
# ─────────────────────────────────────────────────────────────────────────

# Path to the browser binary. "auto" searches the usual locations.
CHROME_PATH=auto

# Isolated profile. NEVER point this at your normal Chrome profile — this
# browser deliberately reports different values and shares nothing with it.
PROFILE_DIR=~/.ghostshell/profile

# ── Exit location ────────────────────────────────────────────────────────
# Set these to match where your VPN/proxy actually exits, e.g.
#   TIMEZONE=Europe/Berlin
#   LOCALE=de-DE
# Leaving them empty uses your real system values.
TIMEZONE=
LOCALE=

# ── Proxy ────────────────────────────────────────────────────────────────
# Leave PROXY empty when you use a real system VPN (recommended — it tunnels
# UDP too). Fill it in only for a browser-level proxy:
#   PROXY=socks5://127.0.0.1:1080
#   PROXY=http://127.0.0.1:8080
PROXY=
PROXY_BYPASS=localhost;127.0.0.1;[::1]

# ── Network hardening ────────────────────────────────────────────────────
# QUIC (HTTP/3) is UDP. Most proxies don't tunnel UDP, so Chrome silently
# falls back to a direct connection and your real IP walks out in the clear.
DISABLE_QUIC=1

# Most VPNs tunnel IPv4 only. If you have IPv6, it bypasses the tunnel.
BLOCK_IPV6=1

# Safe Browsing sends URL hashes to Google. Off = more private, but you lose
# phishing/malware protection. Default keeps it ON.
DISABLE_SAFE_BROWSING=0

# ── Window ───────────────────────────────────────────────────────────────
# Fingerprint scripts correlate inner/outer size with the reported screen.
# A common desktop size blends in; an odd size stands out.
WINDOW_SIZE=1440,900

# Anything else you want passed straight through to Chrome.
EXTRA_FLAGS=
