name: Fallen Music — build & smoke test

on:
  push:
    branches: ["arena/37ae90c8-userbot", "uncheck", "main"]
    paths:
      - "fallenmusic/**"
      - "render.yaml"
      - ".github/workflows/fallenmusic.yml"
  pull_request:
    paths:
      - "fallenmusic/**"
      - "render.yaml"
      - ".github/workflows/fallenmusic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Import + health-endpoint smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fallenmusic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fallenmusic/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Verify pinned versions resolve
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for dist in ("py-tgcalls", "Kurigram", "pytgcalls"):
              try:
                  print(f"{dist} == {md.version(dist)}")
              except md.PackageNotFoundError:
                  print(f"{dist} NOT INSTALLED")
          # Every pytgcalls symbol the bot imports must exist.
          from pytgcalls import PyTgCalls, StreamType
          from pytgcalls.exceptions import (
              NoActiveGroupCall, TelegramServerError, UnMuteNeeded,
          )
          from pytgcalls.types import AudioPiped, HighQualityAudio, Update
          from pytgcalls.__version__ import __version__
          print("pytgcalls symbols OK, version", __version__)
          PY

      - name: Config rejects missing credentials
        run: |
          set +e
          env -u API_ID -u API_HASH -u BOT_TOKEN -u SESSION -u OWNER_ID \
            python -c "import config" 2>&1 | tee /tmp/out.txt
          set -e
          grep -q "required environment variable API_ID" /tmp/out.txt

      # Regression test for the deferred-startup ordering bug: modules bind
      # BOT_USERNAME / fallendb by value, so the package must be importable
      # before fallen_startup() has run.
      - name: Every module imports with startup deferred (no network)
        env:
          API_ID: "123456"
          API_HASH: "00000000000000000000000000000000"
          BOT_TOKEN: "123456:TEST-fake-token-for-ci"
          SESSION: "BQFakeSessionStringForCI"
          OWNER_ID: "1"
          FALLEN_DEFER_STARTUP: "1"
        run: |
          python check_imports.py 2>&1 | tee /tmp/imports.txt
          grep -q "IMPORT CHECK PASSED" /tmp/imports.txt
          grep -q "22/22 modules imported" /tmp/imports.txt

      - name: Health endpoint serves and reports degraded before connect
        env:
          API_ID: "123456"
          API_HASH: "00000000000000000000000000000000"
          BOT_TOKEN: "123456:TEST-fake-token-for-ci"
          SESSION: "BQFakeSessionStringForCI"
          OWNER_ID: "1"
          PORT: "10000"
          RETRY_SECONDS: "600"
        run: |
          python web.py & APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:10000/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "--- /health ---"
          curl -fsS http://127.0.0.1:10000/health | tee /tmp/health.json
          echo
          # The health server must be up immediately, independent of whether
          # Telegram is reachable — that is the whole point of web.py.
          grep -q '"service": "fallen-music"' /tmp/health.json
          grep -q '"status": "degraded"' /tmp/health.json
          grep -q '"attempts": [1-9]' /tmp/health.json
          echo "--- /health/strict must be 503 until Telegram connects ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/health/strict)
          echo "strict status: $code"
          [ "$code" = "503" ]

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (same Dockerfile Render uses)
        run: docker build -t fallen-music:ci ./fallenmusic

      - name: Verify ffmpeg is inside the image
        run: docker run --rm --entrypoint ffmpeg fallen-music:ci -version | head -1

      # py-tgcalls 0.9.7 spawns `node dist/index.js` for voice chat and raises
      # NodeJSNotInstalled from check_environment() when `node -v` is empty.
      # Minimum version is 15.0.0 (pytgcalls/scaffold.py).
      - name: Verify Node.js is inside the image (needed by py-tgcalls)
        run: |
          docker run --rm --entrypoint node fallen-music:ci -v | tee /tmp/node.txt
          major=$(tr -d 'v' < /tmp/node.txt | cut -d. -f1)
          echo "node major version: $major"
          [ "$major" -ge 15 ]

      # This is the exact check pytgcalls/environment.py performs at runtime.
      # If it fails inside the image, /play can never work.
      - name: Verify pytgcalls environment check passes inside the image
        run: |
          docker run --rm --entrypoint python fallen-music:ci -c "
          from pytgcalls.environment import Environment
          from pytgcalls.scaffold import Scaffold
          Environment(
              Scaffold._REQUIRED_NODEJS_VERSION,
              Scaffold._REQUIRED_PYROGRAM_VERSION,
              Scaffold._REQUIRED_TELETHON_VERSION,
              'pyrogram',
          ).check_environment()
          print('pytgcalls check_environment() PASSED inside image')
          "

      - name: Verify web.py is the entrypoint
        run: |
          docker image inspect fallen-music:ci \
            --format '{{json .Config.Cmd}} {{json .Config.ExposedPorts}}'
