name: Deploy GhostShell site to Pages

on:
  push:
    branches: ["arena/bec46eeb-userbot"]
    paths:
      - "ghostshell/**"
      - ".github/workflows/deploy-ghostshell-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R ghostshell/site/. _site/
          cp ghostshell/install.sh _site/install.sh

          # Full package: launchers + extension + tools, minus the site itself.
          # Members keep the "ghostshell/" prefix so `tar -xzf` lands in a
          # directory named ghostshell, which is what install.sh expects.
          tar --exclude='ghostshell/site' \
              --exclude='.DS_Store' \
              -czf _site/ghostshell.tar.gz ghostshell

          # Extension on its own, for people already on a system VPN
          ( cd ghostshell/extension && zip -qr ../../_site/extension.zip . )

          # Self-test needs to be reachable at a stable URL
          cp ghostshell/site/leak-test.html _site/leak-test.html

          # Keep the previous Pages landing page (docs/index.html, previously
          # served by the legacy /docs build) reachable instead of deleting it.
          if [ -f docs/index.html ]; then
            mkdir -p _site/legacy
            cp docs/index.html _site/legacy/index.html
            if [ -f docs/404.html ]; then cp docs/404.html _site/legacy/404.html; fi
            if [ -f docs/.nojekyll ]; then cp docs/.nojekyll _site/legacy/.nojekyll; fi
          fi

          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><title>404 · GhostShell</title>' \
            '<link rel="stylesheet" href="/userbot/styles.css">' \
            '<body style="display:grid;place-items:center;min-height:100vh;text-align:center">' \
            '<div><h1 style="font-size:22px;margin:0 0 8px">404</h1>' \
            '<p style="color:#99a2b6;margin:0 0 18px">That page does not exist.</p>' \
            '<a class="btn" href="/userbot/">Back to GhostShell</a></div>' > _site/404.html

          ls -la _site
          echo "--- tarball contents ---"
          tar -tzf _site/ghostshell.tar.gz | head -40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
